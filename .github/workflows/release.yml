name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag, version, and branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must have the form vX.Y.Z; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag version $tag_version does not match Cargo.toml version $manifest_version" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag $GITHUB_REF_NAME must point to a commit contained in main" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked --target "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Verify and package binary
        shell: bash
        run: |
          set -euo pipefail

          binary="target/${{ matrix.target }}/release/mdglance"
          "$binary" --version
          file "$binary"

          archive="mdglance-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          mkdir "$staging/mdglance-${GITHUB_REF_NAME}"
          cp "$binary" README.md LICENSE THIRD_PARTY_NOTICES.md "$staging/mdglance-${GITHUB_REF_NAME}/"
          tar -C "$staging" -czf "$archive" "mdglance-${GITHUB_REF_NAME}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: mdglance-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum mdglance-*.tar.gz > SHA256SUMS

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            mdglance-*.tar.gz \
            SHA256SUMS \
            --verify-tag \
            --prerelease \
            --generate-notes \
            --title "mdglance ${GITHUB_REF_NAME#v}"
