[package]
name = "mdglance"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A keyboard-first Markdown and SVG previewer for terminal workflows"
license = "MIT"
repository = "https://github.com/NepomukWolf/mdglance"
readme = "README.md"
keywords = ["markdown", "preview", "viewer", "svg"]
categories = ["command-line-utilities", "gui"]
include = [
    "/src/**",
    "/assets/app.js",
    "/assets/style.css",
    "/assets/mermaid.min.js",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
html-escape = "0.2"
notify = "8.2"
open = "5"
pulldown-cmark = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
tao = "0.34"
toml = "0.9"
url = "2.5"
wry = "0.53"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSNotification", "NSOperation", "NSString", "block2"] }
